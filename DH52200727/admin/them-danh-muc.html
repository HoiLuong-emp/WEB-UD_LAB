<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Danh Mục - MUSIN Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f4f6f9; margin: 0; font-family: 'Montserrat', sans-serif;">

    <div class="admin-topbar" style="background: #111111; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; letter-spacing: 2px;">MUSIN CONTROL</span>
        <a href="#" onclick="localStorage.clear(); window.location.href='login.html';" style="color: #ff4d4d; text-decoration: none; font-size: 13px;"><i class="fas fa-sign-out-alt"></i> Thoát</a>
    </div>

    <div style="display: flex; min-height: calc(100vh - 68px);">
        <aside class="admin-sidebar" style="width: 250px; background: #ffffff; border-right: 1px solid #EFECE6; padding: 25px 15px; flex-shrink: 0;">
            <div class="menu-group" style="margin-bottom: 25px;">
                <p style="font-size: 11px; font-weight: 700; color: #999; margin-bottom: 10px; letter-spacing: 1px; padding-left: 10px;">CHUNG</p>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 5px;"><a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-chart-pie" style="width: 18px;"></i> Dashboard</a></li>
                    <li style="margin-bottom: 5px;"><a href="them-san-pham.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-plus-circle" style="width: 18px;"></i> Thêm sản phẩm</a></li>
                    <li style="margin-bottom: 5px;"><a href="them-danh-muc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: #111; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; border-radius: 6px;"><i class="fas fa-folder-plus" style="width: 18px;"></i> Thêm danh mục</a></li>
                </ul>
            </div>
            <div class="menu-group" style="margin-bottom: 25px;">
                <p style="font-size: 11px; font-weight: 700; color: #999; margin-bottom: 10px; letter-spacing: 1px; padding-left: 10px;">QUẢN LÝ</p>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 5px;"><a href="quan-ly-san-pham.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-guitar" style="width: 18px;"></i> Sản phẩm</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-danh-muc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-list" style="width: 18px;"></i> Danh mục</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-nguoi-dung.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-users" style="width: 18px;"></i> Người dùng</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-don-hang.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-shopping-cart" style="width: 18px;"></i> Đơn hàng</a></li>
                </ul>
            </div>
        </aside>

        <main style="flex-grow: 1; padding: 30px;">
            <h1 style="font-size: 24px; font-weight: 700;">Tạo Danh Mục Nhạc Cụ Mới</h1>
            <div style="background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #EFECE6; max-width: 500px;">
                <form onsubmit="alert('Thêm danh mục mới thành công!'); window.location.href='quan-ly-danh-muc.html'; return false;">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;">TÊN DANH MỤC</label>
                        <input type="text" required placeholder="Ví dụ: Kèn & Nhạc cụ hơi" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Montserrat'; box-sizing: border-box;">
                    </div>
                    <button type="submit" style="background: #111; color: #fff; border: none; padding: 12px 25px; font-weight: 600; border-radius: 4px; cursor: pointer;">XÁC NHẬN TẠO</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
