<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm - MUSIN Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f4f6f9; margin: 0; font-family: 'Montserrat', sans-serif;">

    <div class="admin-topbar" style="background: #111111; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <div class="admin-logo">
            <a href="index.html" style="color: #fff; text-decoration: none; display: flex; flex-direction: column;">
                <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">MUSIN CONTROL</span>
                <span style="font-size: 9px; color: #888; letter-spacing: 1px;">BACKEND MANAGEMENT</span>
            </a>
        </div>
        <div class="admin-profile" style="display: flex; align-items: center; gap: 15px;">
            <span style="font-size: 13px; color: #ddd;">Xin chào, <strong id="admin-name-display" style="color: #fff;">Admin</strong></span>
            <a href="#" onclick="handleLogout(event)" style="color: #ff4d4d; font-size: 13px; text-decoration: none; font-weight: 600;"><i class="fas fa-sign-out-alt"></i> Thoát</a>
        </div>
    </div>

    <div class="dashboard-wrapper" style="display: flex; min-height: calc(100vh - 68px);">
        <aside class="admin-sidebar" style="width: 250px; background: #ffffff; border-right: 1px solid #EFECE6; padding: 25px 15px; flex-shrink: 0;">
            <div class="menu-group" style="margin-bottom: 25px;">
                <p style="font-size: 11px; font-weight: 700; color: #999; margin-bottom: 10px; letter-spacing: 1px; padding-left: 10px;">CHUNG</p>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 5px;"><a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-chart-pie" style="width: 18px;"></i> Dashboard</a></li>
                    <li style="margin-bottom: 5px;"><a href="them-san-pham.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: #111; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; border-radius: 6px;"><i class="fas fa-plus-circle" style="width: 18px;"></i> Thêm sản phẩm</a></li>
                    <li style="margin-bottom: 5px;"><a href="them-danh-muc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-folder-plus" style="width: 18px;"></i> Thêm danh mục</a></li>
                </ul>
            </div>
            <div class="menu-group" style="margin-bottom: 25px;">
                <p style="font-size: 11px; font-weight: 700; color: #999; margin-bottom: 10px; letter-spacing: 1px; padding-left: 10px;">QUẢN LÝ</p>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 5px;"><a href="quan-ly-san-pham.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-guitar" style="width: 18px;"></i> Sản phẩm</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-danh-muc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-list" style="width: 18px;"></i> Danh mục</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-nguoi-dung.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-users" style="width: 18px;"></i> Người dùng</a></li>
                    <li style="margin-bottom: 5px;"><a href="quan-ly-don-hang.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #555; font-size: 13px; font-weight: 500; text-decoration: none; border-radius: 6px;" class="side-link"><i class="fas fa-shopping-cart" style="width: 18px;"></i> Đơn hàng</a></li>
                </ul>
            </div>
        </aside>

        <main style="flex-grow: 1; padding: 30px;">
            <div style="margin-bottom: 25px;">
                <h1 style="font-size: 24px; font-weight: 700; color: #111; margin: 0;">Thêm Sản Phẩm Nhạc Cụ</h1>
                <p style="font-size: 13px; color: #777; margin: 5px 0 0 0;">Nhập thông tin sản phẩm mới phân phối vào hệ thống.</p>
            </div>

            <div style="background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #EFECE6; max-width: 700px;">
                <form onsubmit="handleSaveProduct(event)">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;">TÊN SẢN PHẨM / NHẠC CỤ</label>
                        <input type="text" required placeholder="Ví dụ: Đàn Guitar Acoustic Fender CD-60S" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Montserrat';">
                    </div>
                    
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="flex: 1;">
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;">DANH MỤC</label>
                            <select style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Montserrat';">
                                <option>Guitar</option>
                                <option>Piano</option>
                                <option>Trống (Drums)</option>
                                <option>Phụ kiện nhạc cụ</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;">GIÁ BÁN (VND)</label>
                            <input type="number" required placeholder="Ví dụ: 5500000" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Montserrat';">
                        </div>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;">HÌNH ẢNH SẢN PHẨM</label>
                        <input type="file" required style="font-family: 'Montserrat';">
                    </div>

                    <button type="submit" style="background: #111; color: #fff; border: none; padding: 12px 30px; font-weight: 600; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">Lưu sản phẩm</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem("isLoggedIn") !== "true" || localStorage.getItem("userRole") !== "admin") {
                window.location.href = "login.html";
            }
            document.getElementById("admin-name-display").innerText = localStorage.getItem("currentUser");
        });
        function handleSaveProduct(e) {
            e.preventDefault();
            alert("Đã thêm nhạc cụ mới thành công!");
            window.location.href = "quan-ly-san-pham.html";
        }
        function handleLogout(e) { e.preventDefault(); localStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
